name: Typst CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
permissions:
  contents: read
concurrency:
  group: typst-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        profile: [default, draft, screen, print]
    uses: edithatogo/repository-standards/.github/workflows/typst-ci.yml@f37a6c6a9764766ac25d2c65c7ec71f3a7a9fd87 # main
    with:
      root-file: thesis.typ
      output-file: build/thesis-${{ matrix.profile }}.pdf
      artifact-name: typst-thesis-${{ matrix.profile }}
      profile: ${{ matrix.profile }}
